<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon's Project - E Code</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600">Simon's E-Code Portal</h1>
            <span class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-medium">Active Mode</span>
        </div>
    </nav>

    <!-- Main Wrapper -->
    <main class="max-w-3xl mx-auto px-4 py-6">
        
        <!-- Post Upload Box -->
        <div class="bg-white border rounded-2xl shadow-sm p-5 mb-6">
            <h2 class="text-lg font-semibold mb-3 text-gray-800">নতুন কিছু পোস্ট করো</h2>
            
            <form id="ePostForm" class="space-y-4">
                <div>
                    <input type="text" id="userName" placeholder="তোমার নাম..." required
                        class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <textarea id="userText" rows="3" placeholder="মনে কী আছে লিখে ফেলো..." required
                        class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm resize-none"></textarea>
                </div>

                <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                    <label class="w-full sm:w-auto flex items-center justify-center gap-2 px-4 py-2 border border-dashed border-gray-300 rounded-xl cursor-pointer hover:bg-gray-50 text-sm text-gray-600">
                        <span>📷 ছবি যুক্ত করো</span>
                        <input type="file" id="userImage" accept="image/*" class="hidden">
                    </label>

                    <button type="submit" 
                        class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-xl text-sm transition duration-150">
                        পোস্ট করো
                    </button>
                </div>
                <!-- Selected Image Name Preview -->
                <p id="imageFileName" class="text-xs text-gray-400 hidden"></p>
            </form>
        </div>

        <!-- Post Feed Section -->
        <div id="feedContainer" class="space-y-5">
            <!-- ডাইনামিক পোস্টগুলো এখানে দেখাবে -->
        </div>

    </main>

    <!-- JavaScript Core Logic -->
    <script>
        const ePostForm = document.getElementById('ePostForm');
        const feedContainer = document.getElementById('feedContainer');
        const userImageInput = document.getElementById('userImage');
        const imageFileName = document.getElementById('imageFileName');

        // ছবির নাম দেখানোর জন্য
        userImageInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                imageFileName.textContent = "সিলেক্ট করা ফাইল: " + this.files[0].name;
                imageFileName.classList.remove('hidden');
            } else {
                imageFileName.classList.add('hidden');
            }
        });

        // পেজ লোড হলে পোস্ট লোড হবে
        document.addEventListener('DOMContentLoaded', loadAllPosts);

        ePostForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('userName').value.trim();
            const text = document.getElementById('userText').value.trim();
            const imageFile = userImageInput.files[0];

            if (imageFile) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    savePost(name, text, event.target.result);
                };
                reader.readAsDataURL(imageFile);
            } else {
                savePost(name, text, null);
            }
        });

        function savePost(name, text, imageUrl) {
            const newPost = {
                id: Date.now(),
                name,
                text,
                imageUrl,
                time: new Date().toLocaleString('bn-BD', { dateStyle: 'short', timeStyle: 'short' })
            };

            let posts = JSON.parse(localStorage.getItem('simon_e_posts')) || [];
            posts.unshift(newPost); // নতুন পোস্ট সবার উপরে
            localStorage.setItem('simon_e_posts', JSON.stringify(posts));

            ePostForm.reset();
            imageFileName.classList.add('hidden');
            loadAllPosts();
        }

        function loadAllPosts() {
            let posts = JSON.parse(localStorage.getItem('simon_e_posts')) || [];
            feedContainer.innerHTML = '';

            if (posts.length === 0) {
                feedContainer.innerHTML = `<div class="text-center py-8 text-gray-400 bg-white border rounded-2xl p-6">এখনো কোনো পোস্ট নেই। প্রথম পোস্ট তুমিই করো!</div>`;
                return;
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'bg-white border rounded-2xl shadow-sm p-5 overflow-hidden';

                let imgTag = post.imageUrl ? `
                    <div class="mb-4 rounded-xl overflow-hidden bg-gray-100 flex justify-center max-h-[400px]">
                        <img src="${post.imageUrl}" class="w-full object-cover" alt="Post Image">
                    </div>` : '';

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="font-bold text-gray-800 text-base">${escapeHtml(post.name)}</h3>
                            <span class="text-xs text-gray-400">${post.time}</span>
                        </div>
                        <button onclick="removePost(${post.id})" class="text-gray-400 hover:text-red-500 text-xs px-2 py-1 transition">মুছে ফেলো</button>
                    </div>
                    <p class="text-gray-700 text-sm mb-3 whitespace-pre-line leading-relaxed">${escapeHtml(post.text)}</p>
                    ${imgTag}
                `;
                feedContainer.appendChild(card);
            });
        }

        function removePost(id) {
            let posts = JSON.parse(localStorage.getItem('simon_e_posts')) || [];
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('simon_e_posts', JSON.stringify(posts));
            loadAllPosts();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
