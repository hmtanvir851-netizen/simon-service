<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon's Post Portal - সাইমনের পোস্ট পোর্টাল</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">🚀 সাইমনের পোস্ট কর্নার</h1>
            <span class="text-sm bg-indigo-700 px-3 py-1 rounded-full">E-Code V2.0</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-8 max-w-2xl">
        
        <!-- Post Creation Form -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 text-indigo-600">নতুন পোস্ট তৈরি কর</h2>
            
            <form id="postForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">তোর নাম</label>
                    <input type="text" id="authorName" required placeholder="এখানে তোর নাম লিখ..." 
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">কী বলতে চাও?</label>
                    <textarea id="postContent" rows="3" required placeholder="মনের কথা বা ক্যাপশন এখানে লিখ..." 
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ছবি আপলোড কর</label>
                    <input type="file" id="postImage" accept="image/*" 
                        class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                </div>

                <button type="submit" 
                    class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition duration-200">
                    পোস্ট পাবলিশ কর 📤
                </button>
            </form>
        </div>

        <!-- Posts Feed Container -->
        <div id="postsContainer" class="space-y-6">
            <!-- ডাইনামিক পোস্টগুলো এখানে এসে জমা হবে -->
        </div>

    </main>

    <!-- JavaScript for Handling Posts and Images -->
    <script>
        const postForm = document.getElementById('postForm');
        const postsContainer = document.getElementById('postsContainer');

        // পেজ লোড হলে আগের পোস্টগুলো দেখানোর জন্য
        document.addEventListener('DOMContentLoaded', loadPosts);

        postForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const author = document.getElementById('authorName').value;
            const content = document.getElementById('postContent').value;
            const imageInput = document.getElementById('postImage');

            const file = imageInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imageUrl = event.target.result;
                    saveAndRenderPost(author, content, imageUrl);
                    postForm.reset();
                };
                reader.readAsDataURL(file);
            } else {
                saveAndRenderPost(author, content, null);
                postForm.reset();
            }
        });

        function saveAndRenderPost(author, content, imageUrl) {
            const postData = {
                id: Date.now(),
                author,
                content,
                imageUrl,
                date: new Date().toLocaleDateString('bn-BD', { hour: '2-digit', minute: '2-digit' })
            };

            // লোকাল স্টোরেজে সেভ করা
            let posts = JSON.parse(localStorage.getItem('simon_posts')) || [];
            posts.unshift(postData); // নতুন পোস্ট সবার উপরে থাকবে
            localStorage.setItem('simon_posts', JSON.stringify(posts));

            renderPosts();
        }

        function loadPosts() {
            renderPosts();
        }

        function renderPosts() {
            let posts = JSON.parse(localStorage.getItem('simon_posts')) || [];
            postsContainer.innerHTML = '';

            if (posts.length === 0) {
                postsContainer.innerHTML = `<p class="text-center text-gray-500">এখনো কোনো পোস্ট করা হয়নি। প্রথম পোস্ট তুই করে ফেল!</p>`;
                return;
            }

            posts.forEach(post => {
                const postCard = document.createElement('div');
                postCard.className = 'bg-white rounded-xl shadow-md p-6 overflow-hidden';
                
                let imageHTML = post.imageUrl ? `<div class="mb-4 rounded-lg overflow-hidden max-h-96 flex justify-center bg-black/5"><img src="${post.imageUrl}" alt="Post Image" class="object-cover w-full"></div>` : '';

                postCard.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h3 class="font-bold text-gray-900">${escapeHtml(post.author)}</h3>
                            <span class="text-xs text-gray-400">${post.date}</span>
                        </div>
                        <button onclick="deletePost(${post.id})" class="text-red-500 hover:text-red-700 text-sm">ডিলিট</button>
                    </div>
                    <p class="text-gray-700 mb-4 whitespace-pre-line">${escapeHtml(post.content)}</p>
                    ${imageHTML}
                `;
                postsContainer.appendChild(postCard);
            });
        }

        function deletePost(id) {
            let posts = JSON.parse(localStorage.getItem('simon_posts')) || [];
            posts = posts.filter(post => post.id !== id);
            localStorage.setItem('simon_posts', JSON.stringify(posts));
            renderPosts();
        }

        // সিকিউরিটির জন্য সিম্পল এস্কেপ ফাংশন
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
